<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Filmes em Streaming</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>🎬 Onde Assistir</h1>
    <input id="busca" type="search" placeholder="Buscar filme..." autocomplete="off" aria-label="Buscar filme">
  </header>

  <main>
    <!-- Navegação pelo catálogo (escondida enquanto há uma busca) -->
    <section id="navegacao">
      <div id="servicos" class="servicos">
        <button data-id="8" class="ativo">Netflix</button>
        <button data-id="119">Prime Video</button>
        <button data-id="337">Disney+</button>
        <button data-id="1899">Max</button>
        <button data-id="307">Globoplay</button>
      </div>
      <label class="filtro">Gênero:
        <select id="genero"><option value="">Todos</option></select>
      </label>
      <div id="grade" class="grade"></div>
      <button id="carregar-mais" class="carregar-mais" hidden>Carregar mais</button>
    </section>

    <!-- Resultados da busca -->
    <section id="resultados-busca" hidden>
      <ul id="lista-busca" class="lista-busca"></ul>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>

  <footer class="rodape">
    <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDB" height="14">
    <p>Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB.</p>
    <p>Dados de onde assistir: JustWatch</p>
  </footer>

  <script type="module" src="js/principal.js"></script>
</body>
</html>
